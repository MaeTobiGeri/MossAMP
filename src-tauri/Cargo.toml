[package]
name = "mossamp"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
authors = ["MaeTobiGeri <marlon@demandgames.de>"]

[lib]
name = "mossamp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-flac", "symphonia-vorbis", "symphonia-wav", "symphonia-pcm", "symphonia-ogg", "symphonia-aac", "symphonia-isomp4", "symphonia-alac"] }
lofty = "0.25.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
walkdir = "2.5.0"
toml = "1.2.1"
notify = "8.2.2"
base64 = "0.23.1"
quick-xml = "0.42.0"
tauri-plugin-dialog = "2"
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
ebur128 = "0.1.11"

[target.'cfg(target_os = "android")'.dependencies]
rodio = { version = "0.21", default-features = false, features = ["cpal-shared-stdcxx"] }
